[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qts-api"
version = "0.1.0"
description = "FastAPI service over the qts run registry, trial ledger and research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "qts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "ruff>=0.16"]

[project.scripts]
qts-api-openapi = "qts_api.openapi:main"

[tool.setuptools.packages.find]
include = ["qts_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a real pipeline job (> 30 s)"]
filterwarnings = ["ignore::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["qts_api"]
known-third-party = ["qts"]
