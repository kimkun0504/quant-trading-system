[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qts"
version = "0.1.0"
description = "Quant trading system: alpha, risk, transaction cost, portfolio construction and execution models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3",
  "lightgbm>=4.0", "cvxpy>=1.5", "clarabel>=0.9", "pyarrow>=14", "duckdb>=0.10",
  "pyyaml>=6",
]

[project.scripts]
qts = "qts.cli:main"

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "requests>=2.31", "polars>=0.20"]
dev = [
  "pytest>=7",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.16",
  "pyright>=1.1.380",
  "pandas-stubs>=2.1",   # pyright: typed pandas (strict qts/core)
  "scipy-stubs>=1.14",   # pyright: removes reportMissingTypeStubs on scipy under strict
  "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["qts*"]

[tool.setuptools.package-data]
qts = ["py.typed"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py310"
src = ["qts", "tests", "scripts"]
extend-exclude = ["notebooks", "runs", "data"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "B",    # flake8-bugbear
  "I",    # isort
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "NPY",  # numpy-specific
  "PD",   # pandas-vet (noisy rules ignored below)
  "C4",   # flake8-comprehensions
  "RUF",  # ruff-specific
]
ignore = [
  # --- pandas-vet rules that are noise for this codebase -------------------
  "PD011",  # `.values` -> `.to_numpy()`: false positives on dict/Series-like objects; `.values` on
            # frames is used in hot numerical paths where the dtype is already uniform float64
  "PD008",  # `.at` vs `.loc`: style only
  "PD009",  # `.iat` vs `.iloc`: style only
  "PD010",  # `.pivot_table` vs `.stack/.unstack`: wide<->long reshapes via stack/unstack are core idiom
  "PD013",  # `.melt` vs `.stack`: same reason as PD010
  "PD015",  # `pd.merge` vs `.merge`: style only
  # PD002 (inplace=True) is kept: in-place mutation of shared frames is a real PIT/aliasing hazard.
  # --- other ----------------------------------------------------------------
  "E501",   # line length is enforced by the formatter; long docstring/formula lines are allowed
  "E741",   # ambiguous names `l`/`I`: math notation (identity I, lag l) mirrors the papers
  "RUF001", "RUF002", "RUF003",  # unicode (sigma, rho, x) in strings/docstrings/comments is intentional
  "SIM108", # ternary rewrites hurt readability of multi-line numerical branches
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "B011",   # assert False in tests
  "PD",     # tests build small frames freely
  "NPY002", # legacy np.random in fixtures is fine for tests
  "SIM",
  "RUF012",
]
"**/__init__.py" = ["F401"]  # re-exports

[tool.ruff.lint.isort]
known-first-party = ["qts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

# ------------------------------------------------------------------------ pyright
[tool.pyright]
include = ["qts"]
exclude = ["**/__pycache__", "notebooks", "runs", "data"]
# pythonVersion is deliberately not pinned: pyright follows the interpreter it runs under, so
# each CI leg (3.10 and 3.12) checks against the pandas-stubs that leg installs.  pandas-stubs >= 3
# requires Python >= 3.11 (it imports typing.Self); pinning 3.10 there turns every pandas call into
# Unknown and fails strict mode.  The 3.10 leg still guards the language floor.
typeCheckingMode = "basic"
strict = ["qts/core"]
reportMissingTypeStubs = false
reportMissingImports = "warning"
useLibraryCodeForTypes = true

# ------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests (walk-forward ML, full pipeline); excluded from the fast tier with -m 'not slow'",
  "integration: tests that exercise several layers end-to-end",
]

# ----------------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["qts"]
branch = true
omit = ["qts/**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.xml]
output = "coverage.xml"
