[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qts"
version = "0.1.0"
description = "Quant trading system: alpha, risk, transaction cost, portfolio construction and execution models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3",
  "lightgbm>=4.0", "cvxpy>=1.5", "clarabel>=0.9", "pyarrow>=14", "duckdb>=0.10",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "requests>=2.31", "polars>=0.20"]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
include = ["qts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
